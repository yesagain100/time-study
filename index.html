async function dec(pw){
  const d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:d(ENC.salt),iterations:200000,hash:'SHA-256'},
    km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:d(ENC.iv)},key,d(ENC.ct));
  return new TextDecoder().decode(pt);
}
async function unlock(){
  const pw=document.getElementById('pw').value;
  const err=document.getElementById('err'); err.textContent='Checking…';
  try{
    const html=await dec(pw);
    try{sessionStorage.setItem('ya_ts_pw',pw);}catch(e){}
    document.open(); document.write(html); document.close();
  }catch(e){ err.textContent='Wrong password. Try again.'; }
}
document.getElementById('btn').addEventListener('click',unlock);
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock();});
(function(){try{const s=sessionStorage.getItem('ya_ts_pw');
  if(s){document.getElementById('pw').value=s;unlock();}}catch(e){}})();
</script></body></html>
